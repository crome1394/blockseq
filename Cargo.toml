[package]
name = "blockseq"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
mime_guess = "2.0.5"
parking_lot = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
