<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blockseq</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <aside id="sidebar">
    <a class="brand" href="#/journals">Blockseq</a>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search  (Ctrl+K)" autocomplete="off" spellcheck="false">
      <div id="search-results" class="popup hidden"></div>
    </div>
    <nav>
      <a href="#/journals" data-nav="journals">Journals</a>
      <a href="#/all" data-nav="all">All pages</a>
    </nav>
    <button id="open-settings" class="sidebar-button" type="button">Settings</button>
    <div id="status" class="status ok">Saved</div>
  </aside>
  <main id="main"></main>
  <div id="toast" class="toast hidden"></div>
</body>
</html>
