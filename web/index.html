<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blockseq</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script>
    // Apply the theme and sidebar state before first paint (no flash).
    try {
      const s = JSON.parse(localStorage.getItem('blockseq.settings') || '{}');
      if (s.theme && s.theme !== 'auto') document.documentElement.dataset.theme = s.theme;
      if (s.sidebar === false) document.documentElement.classList.add('sidebar-hidden');
    } catch { /* storage blocked */ }
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <button id="menu-toggle" type="button" title="Show/hide sidebar (Ctrl+\)" aria-label="Toggle sidebar">
    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <aside id="sidebar">
    <a class="brand" href="#/journals">Blockseq</a>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search  (Ctrl+K)" autocomplete="off" spellcheck="false">
      <div id="search-results" class="popup hidden"></div>
    </div>
    <nav>
      <a href="#/journals" data-nav="journals">Journals</a>
      <a href="#/all" data-nav="all">All pages</a>
      <button id="new-journal" class="nav-action" type="button">+ New journal</button>
      <button id="open-journal" class="nav-action" type="button">Open journal…</button>
    </nav>
    <section id="favorites" class="favorites hidden">
      <div class="side-heading">Favorites</div>
      <div class="fav-list"></div>
    </section>
    <div id="calendar" class="calendar" aria-label="Journal calendar"></div>
    <button id="open-settings" class="sidebar-button" type="button">Settings</button>
    <div id="status" class="status ok">Saved</div>
  </aside>
  <main id="main"></main>
  <div id="toast" class="toast hidden"></div>
</body>
</html>
