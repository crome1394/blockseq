<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blockseq</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script>
    // Apply the theme and sidebar state before first paint (no flash).
    try {
      const s = JSON.parse(localStorage.getItem('blockseq.settings') || '{}');
      if (s.theme && s.theme !== 'auto') document.documentElement.dataset.theme = s.theme;
      if (s.sidebar === false) document.documentElement.classList.add('sidebar-hidden');
    } catch { /* storage blocked */ }
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <button id="menu-toggle" type="button" title="Show/hide sidebar (Ctrl+\)" aria-label="Toggle sidebar">
    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <aside id="sidebar">
    <a class="brand" href="#/journals">Blockseq</a>
    <button id="workbook-switch" class="workbook-switch" type="button" title="Switch workbook">
      <span class="wb-label">Workbook</span><span class="wb-name">Main</span><span class="wb-caret">▾</span>
    </button>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search  (Ctrl+K)" autocomplete="off" spellcheck="false">
      <div id="search-results" class="popup hidden"></div>
    </div>
    <nav>
      <a href="#/journals" data-nav="journals"><svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM4 10h16M8 3v4M16 3v4M8 14h2M12 14h2M8 17h2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Journals</span></a>
      <a href="#/all" data-nav="all"><svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 3h7l4 4v10a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM16 3v4h4M5 7v13a1 1 0 0 0 1 1h10M11 11h6M11 14h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>All pages</span></a>
      <a href="#/assets" data-nav="assets"><svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Assets</span></a>
      <button id="new-workbook" class="nav-action" type="button">+ New workbook</button>
      <button id="open-workbook" class="nav-action" type="button">Open workbook…</button>
    </nav>
    <section id="favorites" class="favorites hidden">
      <div class="side-heading">Favorites</div>
      <div class="fav-list"></div>
    </section>
    <div id="calendar" class="calendar" aria-label="Journal calendar"></div>
    <button id="open-settings" class="sidebar-button" type="button">Settings</button>
    <div id="status" class="status ok">Saved</div>
  </aside>
  <main id="main"></main>
  <div id="topbar" class="topbar">
    <button id="tasks-toggle" type="button" title="Tasks (t)" aria-label="Tasks">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6.5l1.5 1.5L8.5 5M11 6.5h9M4 12.5l1.5 1.5 3-3M11 12.5h9M4 18.5h4.5M11 18.5h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="lock-toggle" type="button" title="Unlock encrypted blocks" aria-label="Lock or unlock encrypted blocks">🔒</button>
    <button id="help-toggle" type="button" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
  </div>
  <aside id="pane" class="pane hidden" aria-label="Side pane">
    <div class="pane-grip" title="Drag to resize"></div>
    <div class="pane-head">
      <span class="pane-title"></span>
      <span class="pane-actions"></span>
      <button class="pane-close" type="button" title="Close (Esc)" aria-label="Close">✕</button>
    </div>
    <div class="pane-body"></div>
  </aside>
  <div id="toast" class="toast hidden"></div>
</body>
</html>
